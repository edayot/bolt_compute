[project]
name = "bolt_compute"
version = "0.0.1"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "beet>=0.116.0",
    "bolt>=0.50.1",
]

[dependency-groups]
dev = [
    "black>=24.4.2",
    "pytest-insta>=0.3.0",
    "pytest-cov>=6.0.0",
]

[tool.uv.sources]
beet = { git = "https://github.com/edayot/beet", branch = "runtime_minecraft_version" }
mecha = { git = "https://github.com/edayot/beet/", branch = "runtime_minecraft_version", subdirectory = "packages/mecha" }
bolt = { git = "https://github.com/edayot/beet/", branch = "runtime_minecraft_version", subdirectory = "packages/bolt" }

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"
